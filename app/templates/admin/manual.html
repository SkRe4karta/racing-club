{% extends 'base.html' %}
{% block content %}
<h1>Исключение ROOT: ручной допуск</h1><p>{{ competition.title }}. Административный допуск не является личным согласием владельца или жокея. Действующая заявка, конфликт пары, лимит или начавшийся старт запрещают добавление.</p><form method="POST" class="card p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="horse_id">Лошадь</label><select class="form-select mb-3" name="horse_id" id="horse_id" required>{% for horse in horses %}<option value="{{ horse.id }}">{{ horse.nickname }}</option>{% endfor %}</select><label for="jockey_id">Жокей</label><select class="form-select mb-3" name="jockey_id" id="jockey_id" required>{% for jockey in jockeys %}<option value="{{ jockey.id }}">{{ jockey.full_name }}</option>{% endfor %}</select><label for="reason">Причина исключения (без секретов)</label><input class="form-control mb-3" id="reason" name="reason" minlength="5" maxlength="500" required><button class="btn btn-primary">Добавить под аудит ROOT</button></form>
{% endblock %}
