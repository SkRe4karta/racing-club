{% extends 'base.html' %}

{% block title %}Добавление жокея &mdash; АИС «Скачки»{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card shadow-sm">
            <div class="card-header py-3">
                <h5 class="card-title mb-0 fw-bold">
                    <i class="bi bi-person-plus me-2 text-primary"></i>Регистрация нового жокея
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('jockeys.add_jockey') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-semibold">ФИО жокея <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name or '' }}" required autofocus placeholder="Петров Алексей Сергеевич">
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">Адрес проживания</label>
                        <input type="text" class="form-control" id="address" name="address" value="{{ address or '' }}" placeholder="г. Москва, ул. Скаковая, д. 5">
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="age" class="form-label fw-semibold">Возраст (полных лет) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="age" name="age" min="14" max="100" value="{{ age or '' }}" required placeholder="например 25">
                            <div class="form-text">Целое положительное число</div>
                        </div>
                        <div class="col-md-6">
                            <label for="rating" class="form-label fw-semibold">Рейтинг жокея <span class="text-danger">*</span></label>
                            <input type="number" step="0.1" min="0" max="100" class="form-control" id="rating" name="rating" value="{{ rating or '5.0' }}" required placeholder="например 8.5">
                            <div class="form-text">Числовой показатель мастерства</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('jockeys.list_jockeys') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Назад к списку
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
