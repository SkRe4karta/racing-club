{% if pagination.pages > 1 %}<nav aria-label="Страницы" class="d-flex gap-2 my-3">
{% if pagination.has_prev %}<a class="btn btn-outline-secondary" href="{{ query_url(page=pagination.prev_num) }}">← Назад</a>{% endif %}
<span>Страница {{ pagination.page }} из {{ pagination.pages }}</span>
{% if pagination.has_next %}<a class="btn btn-outline-secondary" href="{{ query_url(page=pagination.next_num) }}">Далее →</a>{% endif %}
</nav>{% endif %}
