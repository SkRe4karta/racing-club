{% extends 'base.html' %}

{% block title %}Добавление владельца &mdash; АИС «Скачки»{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card shadow-sm">
            <div class="card-header py-3">
                <h5 class="card-title mb-0 fw-bold">
                    Добавление нового владельца
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('owners.add_owner') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-semibold">ФИО владельца <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="full_name" name="full_name" maxlength="150" value="{{ full_name or '' }}" required autofocus placeholder="Иванов Иван Иванович">
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">Адрес</label>
                        <input type="text" class="form-control" id="address" name="address" maxlength="255" value="{{ address or '' }}" placeholder="г. Москва, ул. Полевая, д. 12">
                    </div>

                    <div class="mb-4">
                        <label for="phone" class="form-label fw-semibold">Номер телефона</label>
                        <input type="tel" class="form-control" id="phone" name="phone" maxlength="50" value="{{ phone or '' }}" placeholder="+7 (999) 000-00-00">
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('owners.list_owners') }}" class="btn btn-outline-secondary">
                             Назад к списку
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                             Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
